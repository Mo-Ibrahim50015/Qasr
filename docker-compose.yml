version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: qasr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qasr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qasr_password_secure}
      POSTGRES_DB: ${POSTGRES_DB:-qasr_al_otoor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qasr_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qasr_user -d qasr_al_otoor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Cache
  redis:
    image: redis:7-alpine
    container_name: qasr_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - qasr_internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Node.js + Express API Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: qasr_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-qasr_user}:${POSTGRES_PASSWORD:-qasr_password_secure}@postgres:5432/${POSTGRES_DB:-qasr_al_otoor}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-replace-in-production-qasr-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-jwt-key-replace-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qasr_internal_network

  # 4. Background Worker (Notifications, cleanups)
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: qasr_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-qasr_user}:${POSTGRES_PASSWORD:-qasr_password_secure}@postgres:5432/${POSTGRES_DB:-qasr_al_otoor}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qasr_internal_network

  # 5. Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: qasr_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:5000
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - backend
    networks:
      - qasr_internal_network

  # 6. Nginx Reverse Proxy (Facing Cloudflare)
  nginx:
    image: nginx:alpine
    container_name: qasr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - qasr_internal_network

networks:
  qasr_internal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

